<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cardápio — Pipória</title>
  <meta name="description" content="Cardápio da Pipória: pipocas gourmet no balde, açaí na garrafa e panqueca. Escolha, monte o pedido e envie pelo WhatsApp.">
  <meta name="theme-color" content="#061230">
  <link rel="icon" href="img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    (function () {
      var t;
      try { t = localStorage.getItem("piporia_theme"); } catch (e) {}
      if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body data-page="cardapio">
  <div id="site-header"></div>

  <main>
    <section class="sec-night banner" aria-labelledby="banner-title">
      <div class="banner-img" aria-hidden="true"><img src="img/banner-cardapio.jpg" alt=""></div>
      <i class="spark" style="--s:28px;left:2%;top:34%"></i>
      <div class="wrap">
        <span class="eyebrow line">Nosso cardápio</span>
        <h1 id="banner-title">Nosso <em>cardápio</em></h1>
        <p id="banner-text">Pipocas, açaí e panqueca. Escolha o seu favorito.</p>
      </div>
      <div class="wave" aria-hidden="true"></div>
    </section>

    <section class="sec-cream grain section menu-sec">
      <div class="wrap">
        <div class="filters" id="filters" role="group" aria-label="Filtrar por categoria"></div>
        <div id="menu-root"></div>
      </div>
    </section>

    <section class="cta" aria-labelledby="cta-t">
      <div class="wrap">
        <div class="small">ONDE TUDO VIRA</div>
        <h2 id="cta-t">Experiência.</h2>
        <p>Escolheu? Agora é só ir ao carrinho e enviar o pedido pelo WhatsApp.</p>
        <a class="btn btn-navy" href="pedido.html"><span data-i="wa"></span>Ir para o carrinho<span data-i="arrow"></span></a>
      </div>
      <div class="wave" style="--wave:var(--navy-deep)" aria-hidden="true"></div>
    </section>

    <dialog class="modal" id="item-modal" aria-label="Detalhes do item"></dialog>
  </main>

  <div id="site-footer"></div>

  <script src="js/menu-data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cardapio.js"></script>
</body>
</html>
